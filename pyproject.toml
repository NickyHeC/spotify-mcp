[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for Spotify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dedalus-mcp>=0.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.0",
]

[project.scripts]
spotify-mcp = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]
